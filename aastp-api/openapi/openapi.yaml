  schemas:

    Identifier:
      $ref: "./components/schemas/identifier.yaml"

    SourceReference:
      $ref: "./components/schemas/sourceReference.yaml"

    ResponseMetadata:
      $ref: "./components/schemas/responseMetadata.yaml"

    SupportedConstructionProperties:
      $ref: "./components/schemas/supportedConstructionProperties.yaml"

    SupportedExposureProperties:
      $ref: "./components/schemas/supportedExposureProperties.yaml"

    OrientationType:
      $ref: "./components/schemas/orientationType.yaml"

    Structure:
      $ref: "./components/schemas/structure.yaml"

    EcmProtectionRating:
      $ref: "./components/schemas/ecmProtectionRating.yaml"

    PotentialExplosionSiteConstruction:
      $ref: "./components/schemas/potentialExplosionSiteConstruction.yaml"

    PotentialExplosionSiteType:

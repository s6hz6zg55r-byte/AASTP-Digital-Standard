openapi: 3.1.0

info:
  title: AASTP Engineering Service API
  version: 1.0.0
  description: >
    REST API providing access to governed AASTP engineering resources
    and quantity-distance assessment services.
  contact:
    name: AASTP Project
    email: christopher.harbet@defence.gov.au
  license:
    name: NATO

servers:
  - url: https://api.aastp.org/api/v1
    description: Production

  - url: https://test.api.aastp.org/api/v1
    description: Test

tags:
  - name: Reference Data
    description: Governed AASTP engineering reference resources.
  
  - name: Assessment
    description: Quantity-distance assessment operations.
  
  - name: Service Metadata
    description: Service status and release information.

paths:

  /structures:
    $ref: "./paths/structures.yaml"
  
  /pes-types:
    $ref: "./paths/pes-types.yaml"

  /es-types:
    $ref: "./paths/es-types.yaml"

  /hazard-categories:
    $ref: "./paths/hazard-categories.yaml"

  /calculations:
    $ref: "./paths/calculations.yaml"


openapi: 3.1.0

info:
  title: AASTP Digital Engineering API

  summary: >
    Versioned REST API providing controlled access to validated
    AASTP engineering data and governed engineering calculations.

  description: |
    The AASTP Digital Engineering API provides controlled access to
    validated engineering data derived from AASTP-1.

    The API provides a stable integration boundary for engineering
    applications, web clients, mobile applications, document generation
    and external systems.

    Engineering calculations are performed in accordance with the
    Engineering Calculation Model and are fully traceable to the
    underlying engineering rules, formulae and transformations.

  x-engineering-principles:
    - JSON is the authoritative engineering data source.
    - Validation precedes publication.
    - Engineering calculations are governed by the Engineering Calculation Model.
    - REST is the primary integration boundary.

  version: 1.0.0

  contact:
    name: AASTP Digital Engineering Project

  license:
    name: Pending

servers:

  - url: http://localhost:3000/api/v1
    description: Local development server

  - url: https://demo.aastp.org/api/v1
    description: Demonstrator

tags:

  - name: ES Types
    description: >
      Browse and retrieve Exposed Site Types.

  - name: PES Types
    description: >
      Browse and retrieve Potential Explosion Site Types.

  - name: Hazard Categories
    description: >
      Browse and retrieve Hazard Categories.

  - name: Calculations
    description: >
      Perform governed engineering calculations.

  - name: Metadata
    description: >
      Retrieve repository metadata and API information.

externalDocs:
  description: AASTP API Governance Documentation
  url: ./docs/API_CONTRACT.md

components:

  schemas: 

    ResponseMetadata:
      $ref: "./components/schemas/responseMetadata.yaml"
    
    ExposedSiteTypeCollection:

      $ref: "./components/schemas/exposedSiteTypeCollection.yaml"

    ExposedSiteTypeSummary:

      $ref: "./components/schemas/exposedSiteTypeSummary.yaml"
          

  responses: {}

  parameters: {}

  examples: {}

  requestBodies: {}

  securitySchemes: {}

paths:
  /es-types:

    get:

      tags:
        - ES Types

      summary: Retrieve Exposed Site Types

      description: |
        Retrieves the collection of Exposed Site Types (ES Types)
        defined within the authoritative AASTP engineering repository.

        The endpoint returns summary information for each
        Exposed Site Type suitable fo browsing and selection.
      
      operationId: getExposedSiteTypes

      responses:

        "200":

          description: >
            Successfully retrieved the collection of
            Exposed Site Types.

          content:

            application/json:

              schema:

                $ref: "#/components/schemas/ExposedSiteTypeCollection"

        "500":
          $ref: "#/components/responses/InternalServerError"

        "default":
          $ref: "#/components/responses/UnexpectedError"

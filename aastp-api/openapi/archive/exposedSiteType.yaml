# =============================================================================
# Exposed Site Type Schema
# =============================================================================
#
# Purpose
# -------
# Defines the complete public representation of an Exposed Site Type.
#
# Used by
# -------
# - Exposed Site Type entity responses
# - Engineering calculation services
# - Repository browsing clients
#
# =============================================================================

type: object

description: >
  Complete representation of an Exposed Site Type defined within the
  authoritative AASTP engineering repository.

properties:

  id:
    $ref: "#/components/schemas/Identifier"

  code:
    type: string
    description: >
      Engineering code identifying the Exposed Site Type.
    example: "ECM-7BAR"

  name:
    type: string
    description: >
      Human-readable name of the Exposed Site Type.
    example: "Earth Covered Magazine - 7 Bar"

  structure:
    type: string
    description: >
      Stable identifier of the structure definition associated with the
      Exposed Site Type.
    example: "STR001"

  construction:
    $ref: "#/components/schemas/ExposedSiteConstruction"

  exposure:
    $ref: "#/components/schemas/ExposedSiteExposure"

  notes:
    type: string
    description: >
      Additional information associated with the Exposed Site Type.
    example: ""

  source:
    $ref: "#/components/schemas/EngineeringSource"

required:
  - id
  - code
  - name
  - structure
  - construction
  - exposure
  - notes
  - source
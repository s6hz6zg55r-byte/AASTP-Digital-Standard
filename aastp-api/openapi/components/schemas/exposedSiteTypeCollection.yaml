# =============================================================================
# Exposed Site Type Collection Schema
# =============================================================================
#
# Purpose
# -------
# Defines the public collection response containing Exposed Site Type summaries
# and common response metadata.
#
# Used by
# -------
# - Exposed Site Type collection responses
# - GET /es-types
#
# =============================================================================

type: object

description: >
  Public collection response containing validated Exposed Site Type summaries
  and metadata identifying the API and authoritative data release from which
  the collection was produced.

properties:
  data:
    type: array
    description: >
      Exposed Site Types available in the applicable validated data release,
      represented using the concise public summary projection.
    items:
      $ref: "#/components/schemas/ExposedSiteTypeSummary"

  metadata:
    $ref: "#/components/schemas/ResponseMetadata"

required:
  - data
  - metadata
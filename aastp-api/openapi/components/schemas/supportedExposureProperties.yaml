# =============================================================================
# Supported Exposure Properties Schema
# =============================================================================
#
# Purpose
# -------
# Defines the exposure-property dimensions applicable to an AASTP Structure.
#
# Used by
# -------
# - Structure resources
# - Exposed Site configuration workflows
#
# =============================================================================

type: object

description: >
  Applicability indicators identifying which exposure-property dimensions
  apply to a Structure. A value of true indicates that the property is
  applicable to the Structure; a value of false indicates that it is not.
  These indicators do not define or prescribe the permitted engineering
  values for an applicable property.

properties:
  category:
    type: boolean
    description: >
      Indicates whether exposure category is an applicable exposure property
      for the Structure.
    example: true

  level:
    type: boolean
    description: >
      Indicates whether exposure level is an applicable exposure property
      for the Structure.
    example: true

required:
  - category
  - level
# =============================================================================
# Exposed Site Construction Schema
# =============================================================================
#
# Purpose
# -------
# Defines the governed construction characteristics associated with an
# Exposed Site Type.
#
# Used by
# -------
# - Exposed Site Type resources
# - Exposed Site configuration workflows
#
# =============================================================================

type: object

description: >
  Public representation of the governed construction characteristics
  associated with an Exposed Site Type. Only construction properties
  applicable to the associated Structure and relevant to the Exposed Site
  resource are represented. Permitted engineering values are derived from
  the applicable validated data release and are not independently defined
  by OpenAPI.

properties:
  ecmProtectionRating:
    $ref: "#/components/schemas/Identifier"

  headwall:
    type: boolean
    description: >
      Indicates the governed headwall characteristic of the Exposed Site Type
      where headwall configuration is applicable to that resource.
    example: true

  barricaded:
    type: boolean
    description: >
      Indicates the governed barricade characteristic of the Exposed Site Type
      where barricade status is applicable to that resource.
    example: false

  roofType:
    type: string
    description: >
      Governed roof-type value associated with the Exposed Site Type where
      roof type is applicable to that resource.
    example: "Protective"
# =============================================================================
# Exposed Site Type Schema
# =============================================================================
#
# Purpose
# -------
# Defines the complete public representation of an authoritative Exposed Site
# Type.
#
# Used by
# -------
# - Exposed Site Type entity responses
# - Exposed Site Type collection responses
# - Exposed Site selection and resource-resolution workflows
#
# =============================================================================

type: object

description: >
  Complete public representation of a validated Exposed Site Type. An Exposed
  Site Type is an authoritative resolved engineering resource associated with
  a Structure and represents one governed combination of applicable
  construction and exposure characteristics. Structure-level applicability
  and orientation remain governed by the associated Structure.

properties:
  id:
    $ref: "#/components/schemas/Identifier"

  code:
    type: string
    description: >
      Engineering code associated with the Exposed Site Type.
    example: "PTR-LOW"

  name:
    type: string
    description: >
      Human-readable name of the Exposed Site Type.
    example: "Low Density Public Traffic Route"

  structure:
    $ref: "#/components/schemas/Identifier"

  construction:
    $ref: "#/components/schemas/ExposedSiteConstruction"

  exposure:
    oneOf:
      - $ref: "#/components/schemas/ExposedSiteExposure"
      - type: "null"

  notes:
    type: string
    description: >
      Supporting engineering notes associated with the Exposed Site Type.
      An empty string indicates that no supporting note is recorded for the
      resource.
    example: ""

  source:
    $ref: "#/components/schemas/SourceReference"

required:
  - id
  - code
  - name
  - structure
  - construction
  - exposure
  - notes
  - source
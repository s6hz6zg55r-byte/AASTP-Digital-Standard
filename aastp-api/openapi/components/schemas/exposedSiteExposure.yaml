# =============================================================================
# Exposed Site Exposure Schema
# =============================================================================
#
# Purpose
# -------
# Defines the governed exposure characteristics associated with an
# Exposed Site Type.
#
# Used by
# -------
# - Exposed Site Type resources
# - Exposed Site configuration workflows
#
# =============================================================================

type: object

description: >
  Public representation of the governed exposure characteristics associated
  with an Exposed Site Type. Exposure is represented by a category and level
  whose permitted engineering values are derived from the applicable
  validated data release and are not independently defined by OpenAPI.

properties:
  category:
    type: string
    description: >
      Governed exposure-category value associated with the Exposed Site Type.
    example: "traffic_density"

  level:
    type: string
    description: >
      Governed exposure-level value associated with the Exposed Site Type.
    example: "low"

required:
  - category
  - level
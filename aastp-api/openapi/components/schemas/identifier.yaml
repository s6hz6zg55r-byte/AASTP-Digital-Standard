# =============================================================================
# Identifier Schema
# =============================================================================
#
# Purpose
# -------
# Defines the stable identifier used for public AASTP engineering resources.
#
# Used by
# -------
# - Structure resources
# - Potential Explosion Site Type resources
# - Exposed Site Type resources
# - Hazard Category resources
# - Other public engineering resources exposing stable identifiers
#
# =============================================================================

type: string

description: >
  Stable opaque identifier for a public AASTP engineering resource. Consumers
  may store and submit the identifier but shall not infer engineering meaning
  from its internal form. The identifier is derived from the applicable
  validated data release.

example: "STR001"
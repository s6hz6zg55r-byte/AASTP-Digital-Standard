# =============================================================================
# Structure Schema
# =============================================================================
#
# Purpose
# -------
# Defines the complete public representation of a Structure and the
# engineering selection dimensions applicable to that Structure.
#
# Used by
# -------
# - Structure entity responses
# - Exposed Site Type selection workflows
# - Potential Explosion Site Type selection workflows
#
# =============================================================================

type: object

description: >
  Complete representation of a Structure defined within the authoritative
  AASTP engineering repository. The Structure identifies the engineering
  characteristics that are applicable when resolving an Exposed Site Type
  or Potential Explosion Site Type.

properties:

  id:
    $ref: "#/components/schemas/Identifier"

  code:
    type: string
    description: >
      Engineering code identifying the Structure.
    example: "ECM"

  name:
    type: string
    description: >
      Human-readable name of the Structure.
    example: "Earth Covered Magazine"

  category:
    type: string
    description: >
      Engineering category used to classify the Structure.
    example: "explosives_facility"

  supportedConstructionProperties:
    $ref: "#/components/schemas/SupportedConstructionProperties"

  supportedExposureProperties:
    $ref: "#/components/schemas/SupportedExposureProperties"

  orientation:
    $ref: "#/components/schemas/Orientation"

required:
  - id
  - code
  - name
  - category
  - supportedConstructionProperties
  - supportedExposureProperties
  - orientation
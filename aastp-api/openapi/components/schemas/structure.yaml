# =============================================================================
# Structure Schema
# =============================================================================
#
# Purpose
# -------
# Defines the complete public representation of an AASTP Structure used to
# support configuration-based PES and Exposed Site selection.
#
# Used by
# -------
# - Structure entity responses
# - PES configuration workflows
# - Exposed Site configuration workflows
#
# =============================================================================

type: object

description: >
  Complete public representation of a validated AASTP Structure. A Structure
  identifies the construction and exposure dimensions applicable to
  configuration-based PES and Exposed Site selection and identifies the
  orientation type governing valid orientation selections. It does not
  resolve a PES Type or Exposed Site Type or prescribe construction or
  exposure values.

properties:
  id:
    $ref: "#/components/schemas/Identifier"

  code:
    type: string
    description: >
      Engineering code associated with the Structure.
    example: "ECM"

  name:
    type: string
    description: >
      Human-readable name of the Structure.
    example: "Earth Covered Magazine"

  category:
    type: string
    description: >
      Governed classification associated with the Structure.
    example: "explosives_facility"

  supportedConstructionProperties:
    $ref: "#/components/schemas/SupportedConstructionProperties"

  supportedExposureProperties:
    $ref: "#/components/schemas/SupportedExposureProperties"

  orientation:
    $ref: "#/components/schemas/OrientationType"

required:
  - id
  - code
  - name
  - category
  - supportedConstructionProperties
  - supportedExposureProperties
  - orientation